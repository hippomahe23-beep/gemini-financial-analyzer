<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Financial Analyst Pro | Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-[#05070a] text-slate-300 min-h-screen border-t-4 border-blue-600">

    <div class="max-w-6xl mx-auto px-6 py-12">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
            <div>
                <h1 class="text-3xl font-black text-white tracking-tighter uppercase">Strategic <span class="text-blue-500">Intelligence</span></h1>
                <p class="text-slate-500 text-sm font-bold tracking-widest uppercase mt-1">Terminal de Données IA v3.5</p>
            </div>
            <div class="w-full md:w-auto">
                <input type="password" id="apiKey" placeholder="CLÉ API GEMINI" class="w-full md:w-72 bg-slate-900/50 border border-slate-800 px-4 py-3 rounded-xl text-xs font-bold text-blue-400 outline-none focus:border-blue-500 transition-all shadow-inner">
            </div>
        </header>

        <section class="bg-slate-900/30 border border-slate-800 p-8 rounded-[2.5rem] backdrop-blur-md mb-12">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-4">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 ml-2">Marché Cible</label>
                    <select id="assetType" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 outline-none focus:border-blue-600 text-white font-bold cursor-pointer">
                        <option value="Euronext Paris">🇫🇷 Euronext (Actions)</option>
                        <option value="US Tech Stocks">🇺🇸 NASDAQ / NYSE</option>
                        <option value="Crypto Currency">🚀 Crypto-monnaies</option>
                        <option value="Government Bonds">📈 Obligations d'État</option>
                    </select>
                </div>
                <div class="md:col-span-8">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 ml-2">Actif à analyser</label>
                    <div class="flex flex-col md:flex-row gap-3">
                        <input type="text" id="assetName" placeholder="Ex: LVMH, NVIDIA, BTC-USD..." class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-blue-600 font-bold text-white transition-all">
                        <button onclick="genererAnalyse()" id="btnRun" class="bg-blue-600 hover:bg-blue-500 px-10 py-4 rounded-2xl font-black text-white uppercase tracking-tighter transition-all active:scale-95 shadow-lg shadow-blue-600/20">
                            Analyser
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <div id="loader" class="hidden text-center py-24">
            <div class="inline-block relative">
                <div class="w-20 h-20 border-2 border-blue-900 border-t-blue-500 rounded-full animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center font-black text-blue-500 text-xs">IA</div>
            </div>
            <p class="mt-8 text-slate-500 font-bold uppercase tracking-[0.3em] text-[10px] animate-pulse">Extraction des données en cours...</p>
        </div>

        <div id="resultArea" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-700">
            <div id="reportContainer" class="bg-white rounded-xl shadow-2xl overflow-hidden mb-8 border border-slate-200">
                <div class="bg-slate-50 px-8 py-4 border-b border-slate-200 flex justify-between items-center">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Rapport Stratégique Officiel</span>
                    <span id="dateRapport" class="text-[10px] font-bold text-slate-500 uppercase"></span>
                </div>
                <div id="reportContent" class="p-10 md:p-16 text-slate-900 font-serif leading-[1.8] text-base md:text-lg whitespace-pre-line">
                    </div>
            </div>
            
            <div class="flex flex-wrap gap-4">
                <button onclick="exportPDF()" class="flex-1 min-w-[200px] bg-slate-900 hover:bg-slate-800 text-white py-5 rounded-2xl font-black uppercase text-xs tracking-widest border border-slate-700 transition-all">
                    💾 Sauvegarder PDF
                </button>
                <button onclick="envoyerParEmail()" class="flex-1 min-w-[200px] bg-blue-600/10 hover:bg-blue-600/20 text-blue-500 py-5 rounded-2xl font-black uppercase text-xs tracking-widest border border-blue-500/30 transition-all">
                    ✉️ Envoyer Email
                </button>
            </div>
        </div>
    </div>

    <script>
        async function genererAnalyse() {
            const key = document.getElementById('apiKey').value;
            const asset = document.getElementById('assetName').value;
            const type = document.getElementById('assetType').value;
            
            if (!key || !asset) return alert("Veuillez saisir votre CLÉ API et un NOM D'ACTIF.");

            const btn = document.getElementById('btnRun');
            btn.disabled = true;
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('dateRapport').innerText = new Date().toLocaleDateString('fr-FR', {year: 'numeric', month: 'long', day: 'numeric'});

            const prompt = `Tu es une IA de terminal financier de type Bloomberg. Analyse : ${asset} (${type}). 
            OBLIGATION : Remplace TOUS les N/A par des données chiffrées réelles basées sur les news du jour. 
            Sois précis et stratégique. Formatage strict requis :

            Bonjour, Voici l'analyse stratégique complète pour ${asset} :
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            📊 SYNTHÈSE EXÉCUTIVE
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🏢 Entreprise : [Nom précis]
            📈 Signal : [ACHAT / VENTE / NEUTRE]
            ⭐ Score : [X/10]
            💭 Sentiment : [Sentiment du marché]
            🎯 Confiance : [X]%
            ⚠️ Niveau de Risque : [Niveau]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            💰 ANALYSE DE VALORISATION
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Prix actuel approximatif, PER ou Market Cap, et tendance de valorisation]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🔮 PRÉVISION COURT TERME (7 JOURS)
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Analyse prédictive basée sur les flux récents]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            ⚡ RISQUES & OPPORTUNITÉS DISRUPTIFS
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Facteurs externes, tech, ou macro]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🧠 RAISONNEMENT STRATÉGIQUE DÉTAILLÉ
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Explication finale condensée]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            Cette analyse a été générée automatiquement par notre système d'intelligence financière.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const text = data.candidates[0].content.parts[0].text;
                document.getElementById('reportContent').innerText = text;
                document.getElementById('resultArea').classList.remove('hidden');
            } catch (error) {
                alert("Erreur de connexion : " + error.message);
            } finally {
                btn.disabled = false;
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function exportPDF() {
            const element = document.getElementById('reportContainer');
            const asset = document.getElementById('assetName').value;
            html2pdf().from(element).set({
                margin: 10,
                filename: `ANALYSE_${asset}_${new Date().getTime()}.pdf`,
                html2canvas: { scale: 3 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).save();
        }

        function envoyerParEmail() {
            const content = document.getElementById('reportContent').innerText;
            const asset = document.getElementById('assetName').value;
            window.location.href = `mailto:?subject=Analyse Strategique : ${asset}&body=${encodeURIComponent(content)}`;
        }
    </script>
</body>
</html>
