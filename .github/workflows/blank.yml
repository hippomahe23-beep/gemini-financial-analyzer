<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Financial Terminal | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-[#020617] text-slate-300 min-h-screen font-sans selection:bg-blue-500/30">

    <div class="max-w-5xl mx-auto px-6 py-10">
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 border-b border-slate-800 pb-8 gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-black text-white tracking-tighter italic">FINANCE<span class="text-blue-500">GPT</span></h1>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.4em] mt-2">Système d'Analyse Stratégique</p>
            </div>
            <div class="relative group">
                <input type="password" id="apiKey" placeholder="CLÉ API GEMINI" class="bg-slate-900/80 border border-slate-800 px-5 py-3 rounded-2xl text-xs font-mono text-blue-400 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all w-72">
            </div>
        </header>

        <main class="bg-slate-900/40 border border-slate-800 p-1 rounded-[2.5rem] shadow-2xl backdrop-blur-xl mb-12">
            <div class="bg-slate-950 p-8 rounded-[2.3rem] border border-slate-800/50">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
                    <div class="md:col-span-5">
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 ml-2">Secteur de Marché</label>
                        <select id="assetType" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-6 py-4 outline-none focus:border-blue-500 text-slate-200 font-bold appearance-none cursor-pointer">
                            <option value="Euronext Paris (CAC40/SBF120)">🇫🇷 Actions Euronext</option>
                            <option value="Wall Street (NASDAQ/NYSE)">🇺🇸 Actions US</option>
                            <option value="Crypto-monnaies (Global)">🚀 Crypto & Web3</option>
                            <option value="Marché Obligataire (Souverain)">📈 Obligations</option>
                        </select>
                    </div>
                    <div class="md:col-span-7">
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 ml-2">Actif Cible</label>
                        <div class="flex flex-col md:flex-row gap-4">
                            <input type="text" id="assetName" placeholder="Ex: LVMH, NVIDIA, BTC..." class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-blue-600 text-white font-bold">
                            <button onclick="lancerAnalyse()" id="btnRun" class="bg-blue-600 hover:bg-blue-500 px-10 py-4 rounded-2xl font-black text-white uppercase tracking-tighter transition-all hover:shadow-[0_0_20px_rgba(37,99,235,0.4)] active:scale-95">
                                ANALYSER
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="loader" class="hidden text-center py-20 animate-in fade-in zoom-in duration-300">
            <div class="inline-block w-16 h-16 border-[6px] border-slate-800 border-t-blue-500 rounded-full animate-spin mb-6"></div>
            <p class="text-slate-400 font-bold uppercase tracking-[0.3em] text-[10px]">Interrogation des serveurs de données...</p>
        </div>

        <div id="resultArea" class="hidden">
            <div id="reportContainer" class="bg-white rounded-3xl shadow-2xl overflow-hidden mb-10 border border-slate-200">
                <div class="bg-slate-50 px-10 py-5 border-b border-slate-200 flex justify-between items-center">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Document Financier Officiel</span>
                    <span id="dateStamp" class="text-[10px] font-bold text-slate-600 uppercase"></span>
                </div>
                <div id="reportContent" class="p-10 md:p-20 text-slate-900 font-serif leading-[1.9] text-base md:text-lg whitespace-pre-line">
                    </div>
            </div>
            
            <div class="flex flex-col md:flex-row gap-4">
                <button onclick="exportPDF()" class="flex-1 bg-slate-900 hover:bg-black text-white py-5 rounded-2xl font-black uppercase text-xs tracking-widest transition-all">
                    📄 Télécharger PDF
                </button>
                <button onclick="envoyerEmail()" class="flex-1 bg-blue-600/10 hover:bg-blue-600/20 text-blue-600 py-5 rounded-2xl font-black uppercase text-xs tracking-widest border border-blue-600/20 transition-all">
                    ✉️ Envoyer par Email
                </button>
            </div>
        </div>
    </div>

    <script>
        async function lancerAnalyse() {
            const key = document.getElementById('apiKey').value;
            const asset = document.getElementById('assetName').value;
            const type = document.getElementById('assetType').value;
            
            if (!key || !asset) return alert("Paramètres manquants : Clé API ou Nom de l'actif.");

            const btn = document.getElementById('btnRun');
            btn.disabled = true;
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('dateStamp').innerText = new Date().toLocaleDateString('fr-FR', { dateStyle: 'full' });

            const prompt = `Tu es un analyste de haut niveau. Analyse : ${asset} (${type}). 
            INTERDICTION de répondre "N/A". Si une donnée est inconnue, fais une estimation basée sur les dernières tendances de marché.
            Rédige le rapport suivant ce format strict :

            Bonjour, Voici l'analyse stratégique complète pour ${asset} :
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            📊 SYNTHÈSE EXÉCUTIVE
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🏢 Entreprise : [Nom exact]
            📈 Signal : [ACHAT / VENTE / NEUTRE]
            ⭐ Score : [Note/10]
            💭 Sentiment : [Sentiment]
            🎯 Confiance : [X]%
            ⚠️ Niveau de Risque : [Risque]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            💰 VALORISATION & PRIX
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Prix récent, Capitalisation et analyse de la valeur actuelle]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🔮 PRÉVISION 7 JOURS
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Analyse prédictive basée sur les actualités récentes]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            ⚡ FACTEURS DISRUPTIFS
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Risques macro, technologiques ou réglementaires]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🧠 SYNTHÈSE FINALE
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Explication stratégique en 5 lignes]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            Généré automatiquement par IA Financial Terminal.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                document.getElementById('reportContent').innerText = text;
                document.getElementById('resultArea').classList.remove('hidden');
            } catch (error) {
                alert("Erreur : Impossible de joindre l'API. Vérifiez votre clé.");
            } finally {
                btn.disabled = false;
                document.getElementById('loader').classList.add('hidden');
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
        }

        function exportPDF() {
            const element = document.getElementById('reportContainer');
            html2pdf().from(element).set({
                margin: 10,
                filename: `RAPPORT_${document.getElementById('assetName').value}.pdf`,
                html2canvas: { scale: 3 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).save();
        }

        function envoyerEmail() {
            const content = document.getElementById('reportContent').innerText;
            const asset = document.getElementById('assetName').value;
            window.location.href = `mailto:?subject=Analyse IA : ${asset}&body=${encodeURIComponent(content)}`;
        }
    </script>
</body>
</html>
