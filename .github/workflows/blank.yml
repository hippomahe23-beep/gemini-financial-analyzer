<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Financial Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center border-b border-slate-700 pb-6 mb-8">
            <h1 class="text-2xl font-bold text-blue-400">Gemini Financial Analyst</h1>
            <input type="text" id="apiKey" placeholder="Clé API Gemini" class="bg-slate-800 border border-slate-600 px-3 py-1 rounded text-sm w-64">
        </div>

        <div class="bg-slate-800 p-6 rounded-xl shadow-xl mb-6">
            <div class="flex gap-4">
                <input type="text" id="companyInput" placeholder="Ex: NVIDIA ou Apple..." class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 outline-none focus:border-blue-500">
                <button onclick="analyser()" id="btn" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-bold transition">Analyser</button>
            </div>
        </div>

        <div id="result" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                    <p class="text-slate-400 text-sm">Entreprise</p>
                    <p id="res-name" class="text-xl font-bold">--</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                    <p class="text-slate-400 text-sm">Score Stratégique</p>
                    <p id="res-score" class="text-xl font-bold text-green-400">--</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                    <p class="text-slate-400 text-sm">Sentiment</p>
                    <p id="res-sentiment" class="text-xl font-bold">--</p>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
                <h2 class="text-blue-300 font-bold mb-4">Raisonnement Détaillé</h2>
                <div id="res-body" class="text-slate-300 leading-relaxed whitespace-pre-line"></div>
            </div>
        </div>

        <div id="loader" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-blue-500 mb-4"></div>
            <p class="text-slate-400">L'IA analyse les marchés...</p>
        </div>
    </div>

    <script>
        async function analyser() {
            const key = document.getElementById('apiKey').value;
            const company = document.getElementById('companyInput').value;
            const btn = document.getElementById('btn');
            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');

            if (!key || !company) return alert("Précisez la clé API et l'entreprise");

            btn.disabled = true;
            loader.classList.remove('hidden');
            resultDiv.classList.add('hidden');

            const prompt = `Fais une analyse financière courte pour ${company}. 
            Réponds uniquement en format JSON avec ces clés: 
            "nom", "score" (sur 10), "sentiment" (Positif/Neutre/Négatif), "analyse" (3 phrases).`;

            try {
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await resp.json();
                const rawJson = JSON.parse(data.candidates[0].content.parts[0].text);

                document.getElementById('res-name').innerText = rawJson.nom;
                document.getElementById('res-score').innerText = rawJson.score + "/10";
                document.getElementById('res-sentiment').innerText = rawJson.sentiment;
                document.getElementById('res-body').innerText = rawJson.analyse;

                resultDiv.classList.remove('hidden');
            } catch (e) {
                alert("Erreur lors de l'analyse. Vérifiez votre clé API.");
                console.error(e);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
