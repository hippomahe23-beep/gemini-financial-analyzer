<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur Financier IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-10">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 border-b border-slate-800 pb-6 gap-4">
            <h1 class="text-3xl font-black bg-gradient-to-r from-blue-500 to-cyan-400 bg-clip-text text-transparent">FINANCE AI PRO</h1>
            <input type="password" id="apiKey" placeholder="Clé API Gemini" class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-sm w-full md:w-64 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl mb-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Type d'actif</label>
                    <select id="assetType" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500 text-slate-200">
                        <option value="Euronext">Action Euronext (Paris/EU)</option>
                        <option value="Crypto">Crypto-monnaie</option>
                        <option value="NASDAQ">Action US (Tech)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Symbole ou Nom</label>
                    <input type="text" id="assetName" placeholder="Ex: LVMH, BTC, NVIDIA" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
                </div>
            </div>
            <button onclick="genererAnalyse()" id="btnRun" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold text-lg transition-all transform hover:scale-[1.01] active:scale-95 shadow-lg shadow-blue-900/20">
                Lancer l'Analyse Stratégique
            </button>
        </div>

        <div id="loader" class="hidden text-center py-20">
            <div class="animate-spin inline-block w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full mb-4"></div>
            <p class="text-slate-400 font-medium italic">Analyse des flux Euronext et sentiment de marché...</p>
        </div>

        <div id="resultArea" class="hidden animate-in fade-in duration-700">
            <div id="reportContent" class="bg-white text-slate-900 p-8 md:p-12 rounded-lg shadow-2xl mb-8 font-mono text-[13px] leading-relaxed border-t-8 border-blue-600">
                </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="exportPDF()" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                    <span>📄</span> Télécharger le Rapport PDF
                </button>
                <button onclick="envoyerParEmail()" class="bg-blue-900/40 hover:bg-blue-900/60 p-4 rounded-2xl font-bold flex items-center justify-center gap-2 text-blue-300 border border-blue-800">
                    <span>📧</span> Envoyer par Email
                </button>
            </div>
        </div>
    </div>

    <script>
        async function genererAnalyse() {
            const key = document.getElementById('apiKey').value;
            const asset = document.getElementById('assetName').value;
            const type = document.getElementById('assetType').value;
            
            if (!key || !asset) return alert("Veuillez remplir tous les champs.");

            const btn = document.getElementById('btnRun');
            btn.disabled = true;
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');

            const prompt = `Analyse l'actif financier suivant : ${asset} (${type}). 
            Cherche les actualités du jour, spécifiquement sur Euronext si applicable. 
            Génère un rapport SANS AUCUN "N/A". Si une donnée précise est manquante, donne une estimation basée sur le sentiment actuel.
            
            Structure du rapport :
            Bonjour, Voici l'analyse stratégique complète pour ${asset} :
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            📊 SYNTHÈSE EXÉCUTIVE
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🏢 Entreprise : [Nom]
            📈 Signal : [ACHAT/VENTE/NEUTRE]
            ⭐ Score : [Note/10]
            💭 Sentiment : [Sentiment]
            🎯 Confiance : [X]%
            ⚠️ Niveau de Risque : [Niveau]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            💰 ANALYSE DE VALORISATION
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Prix actuel, tendance et indicateurs financiers clés]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🔮 PRÉVISION COURT TERME
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Evolution probable à 7 jours]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            ⚡ RISQUES & OPPORTUNITÉS
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Analyse disruptive et concurrence]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🧠 RAISONNEMENT DÉTAILLÉ
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Synthèse stratégique finale]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            Cette analyse a été générée automatiquement par notre système d'intelligence financière.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const resultText = data.candidates[0].content.parts[0].text;
                
                document.getElementById('reportContent').innerText = resultText;
                document.getElementById('resultArea').classList.remove('hidden');
            } catch (error) {
                alert("Erreur de connexion avec Gemini. Vérifiez votre clé.");
            } finally {
                btn.disabled = false;
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function exportPDF() {
            const element = document.getElementById('reportContent');
            html2pdf().from(element).set({
                margin: 10,
                filename: 'Analyse_Strategique.pdf',
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).save();
        }

        function envoyerParEmail() {
            const content = document.getElementById('reportContent').innerText;
            window.location.href = `mailto:?subject=Analyse Financière ${document.getElementById('assetName').value}&body=${encodeURIComponent(content)}`;
        }
    </script>
</body>
</html>
