<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Financial Analyst Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <div class="max-w-5xl mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 border-b border-slate-800 pb-6 gap-4">
            <h1 class="text-2xl font-black text-blue-500 tracking-tighter">FINANCE IA STRATÉGIQUE</h1>
            <input type="password" id="apiKey" placeholder="Clé API Gemini" class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-sm w-full md:w-64 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="bg-slate-900 border border-slate-800 p-8 rounded-[2rem] shadow-2xl mb-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-3">Catégorie</label>
                    <select id="assetType" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
                        <option value="Action Euronext (Paris)">Action Euronext</option>
                        <option value="Crypto Market">Crypto-monnaie</option>
                        <option value="US Tech Market">Action US (Wall Street)</option>
                        <option value="Obligations d'État">Obligations</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-3">Valeur (Nom ou Symbole)</label>
                    <input type="text" id="assetName" placeholder="Ex: LVMH, BTC, NVIDIA" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500 text-white">
                </div>
            </div>
            <button onclick="genererAnalyse()" id="btnRun" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold text-lg transition-all shadow-lg shadow-blue-600/20 active:scale-95">
                GÉNÉRER L'ANALYSE COMPLÈTE
            </button>
        </div>

        <div id="loader" class="hidden text-center py-20">
            <div class="animate-spin inline-block w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full mb-4"></div>
            <p class="text-slate-400 italic">Analyse des flux financiers et actualités en direct...</p>
        </div>

        <div id="resultArea" class="hidden space-y-6">
            <div id="reportWrapper" class="bg-white rounded-xl shadow-2xl overflow-hidden">
                <div class="bg-slate-100 px-8 py-3 border-b border-slate-200 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                    Rapport d'Intelligence Financière
                </div>
                <div id="reportContent" class="p-10 text-slate-900 font-serif leading-relaxed text-sm whitespace-pre-line">
                    </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="exportPDF()" class="bg-slate-800 hover:bg-slate-700 py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                    <span>📄</span> Télécharger PDF
                </button>
                <button onclick="envoyerParEmail()" class="bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 border border-blue-500/30 py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                    <span>📧</span> Envoyer par Email
                </button>
            </div>
        </div>
    </div>

    <script>
        async function genererAnalyse() {
            const key = document.getElementById('apiKey').value;
            const asset = document.getElementById('assetName').value;
            const type = document.getElementById('assetType').value;
            
            if (!key || !asset) return alert("Clé API et Nom de l'actif requis.");

            const btn = document.getElementById('btnRun');
            btn.disabled = true;
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');

            const prompt = `Analyse stratégique de : ${asset} (${type}). 
            Interdiction d'utiliser "N/A". Utilise les données actuelles du marché.
            Rédige exactement selon cette structure :
            
            Bonjour, Voici l'analyse stratégique complète pour ${asset} :
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            📊 SYNTHÈSE EXÉCUTIVE
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🏢 Entreprise : [Nom]
            📈 Signal : [Achat/Vente/Neutre]
            ⭐ Score : [Note/10]
            💭 Sentiment : [Sentiment]
            🎯 Confiance : [X]%
            ⚠️ Niveau de Risque : [Niveau]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            💰 ANALYSE DE VALORISATION
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Prix récent, capitalisation et analyse financière]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🔮 PRÉVISION COURT TERME
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Tendance 7 jours basée sur les news d'aujourd'hui]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            ⚡ RISQUES & OPPORTUNITÉS
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Facteurs de risque et concurrence]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            🧠 RAISONNEMENT DÉTAILLÉ
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            [Synthèse stratégique finale de 4 lignes]
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            Cette analyse a été générée automatiquement par notre système d'intelligence financière.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                document.getElementById('reportContent').innerText = data.candidates[0].content.parts[0].text;
                document.getElementById('resultArea').classList.remove('hidden');
            } catch (e) {
                alert("Erreur d'API. Vérifiez votre clé.");
            } finally {
                btn.disabled = false;
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function exportPDF() {
            const element = document.getElementById('reportWrapper');
            html2pdf().from(element).set({
                margin: 10,
                filename: 'Analyse_Financiere.pdf',
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).save();
        }

        function envoyerParEmail() {
            const content = document.getElementById('reportContent').innerText;
            window.location.href = `mailto:?subject=Analyse Financiere&body=${encodeURIComponent(content)}`;
        }
    </script>
</body>
</html>
